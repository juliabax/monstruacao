<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#be3a5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monstro">
<title>Monstro</title>
<style>
  :root {
    --bg: #fbf7f6; --surface: #ffffff; --text: #2b2326; --muted: #7a6a70;
    --accent: #be3a5c; --accent-ink: #ffffff; --tint: #f6d5de; --line: #eadfe2;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1416; --surface: #251d20; --text: #f3eaed; --muted: #a8979d;
      --accent: #e0698a; --accent-ink: #1a1416; --tint: #4a2634; --line: #382c31;
      --danger: #f2a29c;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(88px + env(safe-area-inset-bottom)); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .card.accent { background: var(--tint); border-color: transparent; }
  .muted { color: var(--muted); font-size: 14px; }
  .banner { background: var(--tint); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .banner button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 8px 12px; white-space: nowrap; }

  .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .nav .title { font-size: 18px; font-weight: 600; text-transform: capitalize; }
  .nav button { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: 48px; height: 48px; font-size: 22px; }
  .today-btn { display: block; margin: 0 auto 8px; background: none; border: 0; color: var(--accent); font-size: 14px; padding: 4px 12px; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
  .day { aspect-ratio: 1; min-height: 44px; border: 1px solid transparent; border-radius: 12px; background: var(--surface); font-size: 16px; padding: 0; position: relative; }
  .day.mid { background: var(--tint); }
  .day.edge { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .day.pred { background: transparent; border: 2px dashed var(--accent); }
  .day.today { border-color: var(--text); }
  .day.future { color: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 4px; }

  .list { list-style: none; margin: 0; padding: 0; }
  .list li button { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .list .row1 { font-weight: 600; }
  .stat { font-size: 28px; font-weight: 700; color: var(--accent); }

  .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 8px; font-weight: 600; text-align: center; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.danger { color: var(--danger); }

  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { flex: 1; background: none; border: 0; padding: 10px 4px 12px; font-size: 13px; color: var(--muted); min-height: 56px; }
  .tabbar button[aria-selected="true"] { color: var(--accent); font-weight: 700; }
  .tabbar button span { display: block; font-size: 20px; line-height: 1.1; }

  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .backdrop.open { display: flex; }
  .sheet { width: 100%; max-width: 480px; background: var(--bg); border-radius: 18px 18px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size: 17px; margin: 0 0 12px; text-transform: capitalize; }

  .toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90%; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <section id="tab-cal">
    <div id="banner"></div>
    <div id="summary" class="card accent"></div>
    <div class="nav">
      <button id="prev" aria-label="Mês anterior">‹</button>
      <div class="title" id="monthTitle"></div>
      <button id="next" aria-label="Próximo mês">›</button>
    </div>
    <button class="today-btn" id="goToday">Ir para hoje</button>
    <div class="grid" id="dows"></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>Início / fim</span>
      <span><i style="background:var(--tint)"></i>Menstruada</span>
      <span><i style="border:2px dashed var(--accent)"></i>Previsão</span>
      <span><i style="border:2px solid var(--text)"></i>Hoje</span>
    </div>
  </section>

  <section id="tab-hist" hidden>
    <h1>Histórico</h1>
    <div id="hist"></div>
  </section>

  <section id="tab-bkp" hidden>
    <h1>Backup</h1>
    <div id="bkp"></div>
  </section>
</div>

<nav class="tabbar" role="tablist">
  <button role="tab" data-tab="cal" aria-selected="true"><span>📅</span>Calendário</button>
  <button role="tab" data-tab="hist" aria-selected="false"><span>📊</span>Histórico</button>
  <button role="tab" data-tab="bkp" aria-selected="false"><span>💾</span>Backup</button>
</nav>

<div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden>

<script>
'use strict';
const KEY = 'ciclo.v1', BKEY = 'ciclo.lastBackup';
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MON = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
const $ = id => document.getElementById(id);

/* ---------- datas (sempre texto AAAA-MM-DD, sem fuso) ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const todayISO = () => { const t = new Date(); return iso(t.getFullYear(), t.getMonth(), t.getDate()); };
const toUTC = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const diff = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 864e5);
const addDays = (s, n) => { const t = new Date(toUTC(s) + n * 864e5); return iso(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()); };
const validISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && addDays(s, 0) === s;
const fmt = (s, withYear) => { const [y, m, d] = s.split('-').map(Number); return `${d} ${MON[m - 1]}` + (withYear ? ` ${y}` : ''); };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/* ---------- dados ---------- */
function cleanPeriods(arr) {
  return arr
    .filter(p => p && validISO(p.start))
    .map(p => ({ start: p.start, end: validISO(p.end) ? p.end : null }))
    .sort((a, b) => (a.start < b.start ? -1 : 1));
}
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && Array.isArray(raw.periods)) return { version: 1, periods: cleanPeriods(raw.periods) };
  } catch (e) {}
  return { version: 1, periods: [] };
}
let state = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('Não foi possível salvar neste aparelho'); }
}
// devolve mensagem de erro ou null
function check(list) {
  const l = [...list].sort((a, b) => (a.start < b.start ? -1 : 1));
  for (let i = 0; i < l.length; i++) {
    const p = l[i];
    if (p.end && p.end < p.start) return 'O fim não pode ser antes do início.';
    if (!p.end && i < l.length - 1) return 'Só o último período pode estar em andamento.';
    if (i > 0 && p.start <= l[i - 1].end) return 'Esse período se sobrepõe a outro registro.';
  }
  return null;
}
function mutate(fn, okMsg) {
  const copy = JSON.parse(JSON.stringify(state.periods));
  fn(copy);
  const err = check(copy);
  if (err) { toast(err); return false; }
  state.periods = copy.sort((a, b) => (a.start < b.start ? -1 : 1));
  save(); closeSheet(); renderAll();
  if (okMsg) toast(okMsg);
  return true;
}
// período em andamento aparece até hoje (no máximo 14 dias)
function shownEnd(p) {
  if (p.end) return p.end;
  const t = todayISO(), cap = addDays(p.start, 13);
  const e = t < cap ? t : cap;
  return e < p.start ? p.start : e;
}

/* ---------- interface ---------- */
let view = (() => { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; })();
let tab = 'cal';

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600);
}

// Previsão: início do último período + média dos últimos ciclos (ignora intervalos fora de 15–60 dias,
// que normalmente são meses sem registro). Não prevê durante uma menstruação em andamento.
function predict() {
  const ps = state.periods;
  if (!ps.length || ps.some(p => !p.end)) return null;
  const gaps = ps.slice(1).map((p, i) => diff(ps[i].start, p.start)).filter(g => g >= 15 && g <= 60).slice(-6);
  if (!gaps.length) return null;
  const avg = a => Math.round(a.reduce((x, y) => x + y, 0) / a.length);
  const durs = ps.map(p => diff(p.start, p.end) + 1).slice(-6);
  return { start: addDays(ps[ps.length - 1].start, avg(gaps)), days: avg(durs), cycle: avg(gaps), n: gaps.length, min: Math.min(...gaps), max: Math.max(...gaps) };
}

function renderSummary() {
  const el = $('summary'), ps = state.periods, t = todayISO();
  const open = ps.find(p => !p.end);
  if (open) {
    const n = diff(open.start, t) + 1;
    el.innerHTML = `<strong>Menstruação em andamento</strong><div class="muted">Dia ${n} · começou em ${fmt(open.start)}. Toque no último dia para marcar o fim.</div>`;
  } else if (ps.length) {
    const last = ps[ps.length - 1], n = diff(last.start, t);
    const pr = predict();
    let next = '<div class="muted" style="margin-top:8px">Registre mais um ciclo para ver a previsão da próxima.</div>';
    if (pr) {
      const k = diff(t, pr.start);
      const when = k > 0 ? `em ${plural(k, 'dia', 'dias')}` : k === 0 ? 'hoje' : `atrasada ${plural(-k, 'dia', 'dias')}`;
      const base = `Ciclo médio de ${pr.cycle} dias, de ${plural(pr.n, 'ciclo', 'ciclos')}` + (pr.min !== pr.max ? ` (varia de ${pr.min} a ${pr.max})` : '') + '. É só uma estimativa.';
      next = k < -14
        ? '<div class="muted" style="margin-top:8px">Já passou muito da data prevista. Se a menstruação veio, toque no dia em que começou para registrar.</div>'
        : `<div style="margin-top:8px"><strong>Próxima prevista: ${fmt(pr.start)}</strong> · ${when}</div><div class="muted">${base}</div>`;
    }
    el.innerHTML = `<strong>Último início: ${fmt(last.start, true)}</strong><div class="muted">${n <= 0 ? 'hoje' : 'há ' + plural(n, 'dia', 'dias')}</div>${next}`;
  } else {
    el.innerHTML = `<strong>Bem-vinda!</strong><div class="muted">Toque num dia do calendário para marcar o início da menstruação.</div>`;
  }
}

function renderBanner() {
  const el = $('banner');
  el.innerHTML = '';
  if (!state.periods.length) return;
  let last = null; try { last = localStorage.getItem(BKEY); } catch (e) {}
  const stale = !last || diff(last, todayISO()) > 30;
  if (!stale) return;
  el.innerHTML = `<div class="banner"><span>${last ? 'Seu último backup tem mais de 30 dias.' : 'Você ainda não fez backup dos seus dados.'}</span><button id="goBkp">Fazer backup</button></div>`;
  $('goBkp').onclick = () => setTab('bkp');
}

function renderCalendar() {
  const { y, m } = view, t = todayISO();
  $('monthTitle').textContent = `${MONTHS[m]} ${y}`;
  const marks = new Map();
  state.periods.forEach(p => {
    const e = shownEnd(p);
    for (let d = p.start; d <= e; d = addDays(d, 1)) {
      marks.set(d, d === p.start || d === p.end ? 'edge' : 'mid');
    }
  });
  const pr = predict();
  if (pr) for (let i = 0, d = pr.start; i < pr.days; i++, d = addDays(d, 1)) if (d >= t && !marks.has(d)) marks.set(d, 'pred');
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  let html = '';
  for (let i = 0; i < first; i++) html += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const s = iso(y, m, d);
    const cls = ['day', marks.get(s) || '', s === t ? 'today' : '', s > t ? 'future' : ''].join(' ');
    html += `<button class="${cls}" data-d="${s}">${d}</button>`;
  }
  $('grid').innerHTML = html;
}

function renderHistory() {
  const ps = state.periods, el = $('hist');
  if (!ps.length) { el.innerHTML = '<div class="card muted">Nenhum registro ainda. Marque o início da menstruação no calendário.</div>'; return; }
  const gaps = ps.slice(1).map((p, i) => diff(ps[i].start, p.start));
  const durs = ps.filter(p => p.end).map(p => diff(p.start, p.end) + 1);
  const avg = a => Math.round(a.reduce((x, y) => x + y, 0) / a.length);
  let stats = '';
  if (gaps.length) {
    stats += `<div class="card"><div class="muted">Ciclo médio</div><div class="stat">${avg(gaps)} dias</div><div class="muted">variando de ${Math.min(...gaps)} a ${Math.max(...gaps)} dias · ${plural(gaps.length, 'ciclo', 'ciclos')}</div></div>`;
  }
  if (durs.length) {
    stats += `<div class="card"><div class="muted">Duração média da menstruação</div><div class="stat">${avg(durs)} ${avg(durs) === 1 ? 'dia' : 'dias'}</div></div>`;
  }
  const items = ps.map((p, i) => {
    const yr = p.start.slice(0, 4);
    const range = p.end ? `${fmt(p.start)} – ${fmt(p.end, true)}` : `${fmt(p.start, true)} – em andamento`;
    const dur = p.end ? plural(diff(p.start, p.end) + 1, 'dia', 'dias') : '';
    const gap = i > 0 ? `${plural(gaps[i - 1], 'dia', 'dias')} desde o início anterior` : 'primeiro registro';
    return `<li><button data-d="${p.start}"><div class="row1">${range}</div><div class="muted">${[dur, gap].filter(Boolean).join(' · ')}</div></button></li>`;
  }).reverse().join('');
  el.innerHTML = stats + `<ul class="list">${items}</ul>`;
}

function renderBackup() {
  let last = null; try { last = localStorage.getItem(BKEY); } catch (e) {}
  const n = state.periods.length;
  $('bkp').innerHTML = `
    <div class="card">
      <div><strong>${plural(n, 'registro', 'registros')}</strong> neste aparelho</div>
      <div class="muted">${last ? 'Último backup: ' + fmt(last, true) : 'Nenhum backup feito ainda.'}</div>
    </div>
    <button class="btn primary" id="exp">Enviar backup (e-mail, Drive…)</button>
    <button class="btn" id="dl">Baixar arquivo</button>
    <button class="btn" id="imp">Restaurar de um arquivo</button>
    <p class="muted">"Enviar backup" abre o menu do celular para você escolher e-mail, Google Drive, WhatsApp… O arquivo vai como .txt, e dá para restaurá-lo normalmente aqui.
    Guarde em um lugar seguro. Seus dados ficam só neste aparelho; nada é enviado para servidor algum.</p>`;
  $('exp').onclick = shareBackup;
  $('dl').onclick = downloadBackup;
  $('imp').onclick = () => $('fileIn').click();
}

function renderAll() {
  renderSummary(); renderBanner(); renderCalendar();
  if (tab === 'hist') renderHistory();
  if (tab === 'bkp') renderBackup();
}

function setTab(name) {
  tab = name;
  ['cal', 'hist', 'bkp'].forEach(n => { $('tab-' + n).hidden = n !== name; });
  document.querySelectorAll('.tabbar button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  if (name === 'hist') renderHistory();
  if (name === 'bkp') renderBackup();
  window.scrollTo(0, 0);
}

/* ---------- ações sobre um dia ---------- */
function closeSheet() { $('backdrop').classList.remove('open'); }
function openSheet(d) {
  const ps = state.periods, t = todayISO();
  const open = ps.find(p => !p.end);
  const cont = ps.find(p => d >= p.start && d <= shownEnd(p));
  const acts = []; let note = '';
  if (cont) {
    const i = ps.indexOf(cont);
    if (d !== cont.start) acts.push(['Mudar o início para este dia', () => mutate(l => { l[i].start = d; }, 'Início alterado')]);
    if (d >= cont.start && d !== cont.end) acts.push(['Marcar o fim neste dia', () => mutate(l => { l[i].end = d; }, 'Fim marcado')]);
    acts.push(['Remover este registro', () => { if (confirm('Remover este período do histórico?')) mutate(l => { l.splice(i, 1); }, 'Registro removido'); }, 'danger']);
  } else if (d > t) {
    note = 'Só é possível registrar dias até hoje.';
  } else if (open && d > open.start) {
    const i = ps.indexOf(open);
    acts.push(['Marcar o fim neste dia', () => mutate(l => { l[i].end = d; }, 'Fim marcado')]);
  } else {
    // antes de um registro já existente (preencher o passado): vira período de 1 dia, e o fim é ajustado depois
    const backfill = !!open || ps.some(p => p.start > d);
    acts.push(['Marcar o início da menstruação aqui', () => mutate(l => { l.push({ start: d, end: backfill ? d : null }); }, 'Início marcado')]);
    const prev = [...ps].reverse().find(p => p.end && p.end < d);
    if (prev && diff(prev.end, d) <= 14) {
      const i = ps.indexOf(prev);
      acts.push([`Mudar o fim do período de ${fmt(prev.start)} para este dia`, () => mutate(l => { l[i].end = d; }, 'Fim alterado')]);
    }
    if (backfill) note = 'Para um período passado, marque o início e depois toque no último dia dele para ajustar o fim.';
  }
  const [y, m, day] = d.split('-').map(Number);
  const wd = DOW[new Date(y, m - 1, day).getDay()];
  $('sheet').innerHTML = `<h2>${wd}, ${day} de ${MONTHS[m - 1]} de ${y}</h2>` +
    (note ? `<p class="muted">${note}</p>` : '') +
    acts.map((a, k) => `<button class="btn ${a[2] || ''}" data-k="${k}">${a[0]}</button>`).join('') +
    `<button class="btn" data-k="x">Cancelar</button>`;
  $('sheet').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.k === 'x') closeSheet(); else acts[+b.dataset.k][1]();
  };
  $('backdrop').classList.add('open');
}

/* ---------- backup ---------- */
function markBackup() { try { localStorage.setItem(BKEY, todayISO()); } catch (e) {} renderAll(); }

function backupJSON() {
  return JSON.stringify({ app: 'monstro', version: 1, exportedAt: new Date().toISOString(), periods: state.periods }, null, 2);
}

// O Chrome do Android só compartilha arquivos de alguns tipos (.txt sim, .json não),
// então o arquivo compartilhado é .txt com o mesmo conteúdo do .json.
async function shareBackup() {
  if (!navigator.share) { toast('Este navegador não consegue compartilhar. Use "Baixar arquivo".'); return; }
  const json = backupJSON(), title = 'Backup do Monstro';
  try {
    const file = new File([json], `monstro-backup-${todayISO()}.txt`, { type: 'text/plain' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title });
    else await navigator.share({ title, text: json });   // sem anexo: o backup vai como texto
    markBackup(); toast('Backup compartilhado');
  } catch (e) {
    if (e.name !== 'AbortError') toast('Não deu para compartilhar (' + e.name + '). Use "Baixar arquivo".');
  }
}

function downloadBackup() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([backupJSON()], { type: 'application/json' }));
  a.download = `monstro-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  markBackup(); toast('Arquivo baixado');
}

function importBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || !Array.isArray(data.periods)) throw new Error();
      const list = cleanPeriods(data.periods);
      if (list.length !== data.periods.length) throw new Error();
      const err = check(list);
      if (err) throw new Error();
      const last = list[list.length - 1];
      const faixa = last ? `, de ${fmt(list[0].start, true)} até ${fmt(last.end || last.start, true)}` : '';
      if (!confirm(`O arquivo tem ${plural(list.length, 'registro', 'registros')}${faixa}.\n\nSubstituir os ${plural(state.periods.length, 'registro atual', 'registros atuais')} por esses?`)) return;
      state.periods = list; save();
      if (last) { const [y, m] = last.start.split('-').map(Number); view = { y, m: m - 1 }; }
      renderAll(); setTab('cal'); toast(`Backup restaurado: ${plural(list.length, 'registro', 'registros')}`);
    } catch (e) { toast('Arquivo inválido: nada foi alterado'); }
  };
  r.readAsText(file);
}

/* ---------- eventos ---------- */
$('dows').innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join('');
$('prev').onclick = () => { view = view.m ? { y: view.y, m: view.m - 1 } : { y: view.y - 1, m: 11 }; renderCalendar(); };
$('next').onclick = () => { view = view.m < 11 ? { y: view.y, m: view.m + 1 } : { y: view.y + 1, m: 0 }; renderCalendar(); };
$('goToday').onclick = () => { const t = new Date(); view = { y: t.getFullYear(), m: t.getMonth() }; renderCalendar(); };
$('grid').onclick = e => { const b = e.target.closest('.day'); if (b) openSheet(b.dataset.d); };
$('hist').onclick = e => {
  const b = e.target.closest('button[data-d]'); if (!b) return;
  const [y, m] = b.dataset.d.split('-').map(Number);
  view = { y, m: m - 1 }; setTab('cal'); renderCalendar();
};
$('backdrop').onclick = e => { if (e.target === $('backdrop')) closeSheet(); };
document.querySelector('.tabbar').onclick = e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); };
$('fileIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); };

// atualiza ao voltar para o app (virou o dia, etc.)
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderAll(); });

renderAll();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
