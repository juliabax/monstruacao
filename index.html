<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1013">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monstro">
<title>Monstro</title>
<style>
  @font-face { font-family: 'Metal Mania'; src: url(assets/fonts/metal-mania.woff2) format('woff2'); font-weight: 400; font-display: swap; }
  :root {
    --display: 'Metal Mania', Georgia, serif;   /* destaque: mês, dias, títulos, abas */
    --ink: #efe4e8; --ink-dim: #bba9b0; --paper-ink: #f3eaed; --muted: #a8979d;
    --accent: #e0698a; --accent-ink: #1a1416; --tint: #4a2634; --line: #4a383f;
    --danger: #f2a29c; --text: var(--ink);
    --box: #3a2a31;   /* cor dos cartões e dos dias comuns */
    --mid: #5a2a3c;   /* dias de menstruação (meio) */
    --barh: calc(min(100vw, 480px) * 0.1557);   /* altura da barra de papel (proporção do desenho) */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #140d10; }
  body { margin: 0; color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: #140d10 url(assets/bg.jpg) center / cover no-repeat; }
  .app { max-width: 480px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(var(--barh) + 170px + env(safe-area-inset-bottom)); }
  h1 { font: 400 26px/1.1 var(--display); margin: 0 0 12px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* caixas grandes: desenho de papel rasgado esticado (9 fatias) */
  .card, .list li button, .sheet, .dlgbox {
    --bw: 22px;
    border: var(--bw) solid transparent;
    border-image: url(assets/big-square-dark.png) 65 fill / var(--bw) stretch;
    /* miolo branco sobrepondo 1,5px da borda: esconde a emenda entre as fatias do papel */
    background: linear-gradient(var(--box), var(--box)) center / calc(100% - 2 * (var(--bw) - 1.5px)) calc(100% - 2 * (var(--bw) - 1.5px)) no-repeat border-box;
    background-origin: border-box; color: var(--paper-ink);
  }
  .card { padding: 2px 6px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .banner { background: var(--tint); color: var(--paper-ink); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .banner button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 8px 12px; white-space: nowrap; }

  .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .nav .title { position: relative; isolation: isolate; flex: 1; text-align: center; padding: 16px 0; color: #fff; font: 400 25px/1.1 var(--display); text-transform: capitalize; text-shadow: 0 1px 3px rgba(40, 0, 15, .6); }
  .nav .title::before { content: ''; position: absolute; z-index: -1; left: 50%; top: 50%; width: min(300px, 100%); aspect-ratio: 983 / 169; transform: translate(-50%, -50%); background: url(assets/backdrop-mes.png) center / contain no-repeat; }   /* respingo atrás do mês */
  .nav button { background: url(assets/sq2-dark.png) center / 100% 100% no-repeat; border: 0; color: var(--paper-ink); width: 52px; height: 52px; font-size: 22px; }
  .today-btn { display: block; margin: 0 auto 8px; background: none; border: 0; color: #f08aa6; font-size: 14px; padding: 4px 12px; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .dow { text-align: center; font-size: 12px; color: var(--ink-dim); padding: 4px 0; }

  /* caixas pequenas: um desenho por dia; a cor do estado entra por multiplicação dentro do mesmo formato */
  .day { aspect-ratio: 1; min-height: 44px; border: 0; background: none; padding: 0; position: relative; isolation: isolate; font: 400 22px/1 var(--display); color: var(--paper-ink); }
  .day::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--sq) center / 100% 100% no-repeat; }
  /* uma imagem já pintada por estado (comum, menstruação, início/fim): sem camadas sobrepostas, sem fiapos claros na borda */
  .day.sq1 { --sq: url(assets/sq1-box.png); } .day.sq2 { --sq: url(assets/sq2-box.png); } .day.sq3 { --sq: url(assets/sq3-box.png); }
  .day.sq1.mid { --sq: url(assets/sq1-mid.png); } .day.sq2.mid { --sq: url(assets/sq2-mid.png); } .day.sq3.mid { --sq: url(assets/sq3-mid.png); }
  .day.sq1.edge { --sq: url(assets/sq1-edge.png); } .day.sq2.edge { --sq: url(assets/sq2-edge.png); } .day.sq3.edge { --sq: url(assets/sq3-edge.png); }
  .day.edge { color: #1a1416; }
  .day, .nav .title, .stat, h1, .sheet h2, .tabbar em { font-variant-numeric: lining-nums; }   /* números alinhados na linha, sem os "antigos" do gótico */
  .day.pred::after { content: ''; position: absolute; inset: 0; z-index: -1; -webkit-mask: var(--sq) center / 100% 100% no-repeat; mask: var(--sq) center / 100% 100% no-repeat; background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(255, 255, 255, .09) 4px 8px); }   /* previsão: mesmo tom dos dias comuns, com listras discretas mais claras */
  .day.today::before { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px rgba(255, 190, 210, .9)); }
  .day.future { color: #6c5b64; }   /* dias que ainda não chegaram: números apagados */
  .day span { position: relative; }
  .day .dot { position: absolute; bottom: 6px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--accent); }
  .day.edge .dot { background: #1a1416; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--ink-dim); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 4px; }

  .list { list-style: none; margin: 0; padding: 0; }
  .list li button { --bw: 16px; width: 100%; text-align: left; margin-bottom: 6px; padding: 2px 6px; }
  .list .row1 { font-weight: 600; }
  .stat { font: 400 36px/1.1 var(--display); color: var(--accent); }

  .btn { display: block; width: 100%; padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: #34262d; color: var(--paper-ink); margin-bottom: 8px; font-weight: 600; text-align: center; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.danger { color: var(--danger); }

  .tabbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; z-index: 4;
    height: calc(var(--barh) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); display: flex;
    background: url(assets/bar-rose.png) top center / 100% var(--barh) no-repeat, linear-gradient(#ba405e, #ba405e) bottom / 100% env(safe-area-inset-bottom) no-repeat;
  }
  .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; background: none; border: 0; padding: 12px 4px 2px; font-size: 13px; font-weight: 700; color: #fff; }
  .tabbar button img { height: 30px; width: auto; opacity: .75; }
  .tabbar button em { font: 400 15px/1.1 var(--display); opacity: .8; }
  .tabbar button[aria-selected="true"] img, .tabbar button[aria-selected="true"] em { opacity: 1; }

  /* monstrinho: peças posicionadas em % da cabeça, em cima da barra */
  .chara-wrap { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 0; z-index: 5; pointer-events: none;
    bottom: calc(var(--barh) + env(safe-area-inset-bottom) - 6px); }
  .chara { position: absolute; right: 5%; bottom: 0; width: min(40vw, 191px); aspect-ratio: 580 / 344; }
  .chara img { position: absolute; display: block; height: auto; }
  .chara .face { position: absolute; inset: 0; transform-origin: 50% 95%; animation: idle 5.2s ease-in-out infinite; }   /* cabeça respirando; as mãos ficam paradas */
  .chara .head { left: 0; top: 0; width: 100%; }
  .chara .eyes { position: absolute; left: 30.4%; top: 26.5%; width: 49.6%; aspect-ratio: 428 / 274; }
  .chara .eyes .eyes-base, .chara .eyes .eyes-lids, .chara .eyes .eyes-happy { left: 0; top: 0; width: 100%; height: 100%; }
  .chara .eyes-happy { opacity: 0; transition: opacity .15s; }
  /* olhos tristes (com as pálpebras caídas), por baixo das pupilas. A imagem é 18 de 274 mais alta (a pálpebra no topo): sobe -6,57% para o branco do olho cair no mesmo lugar do olho normal */
  .chara .eyes .eyes-sad { left: 0; top: -6.57%; width: 100%; height: auto; opacity: 0; transition: opacity .25s; }
  .chara.sad .eyes-base { opacity: 0; transition: opacity 0s .25s; }   /* o olho aberto some só depois que o triste termina de aparecer (sem dar um "buraco" na troca) e volta na hora na saída */   /* olhos felizes (arcos) quando ele sorri */
  .chara .eyes-lids { opacity: 0; animation: blink 5.5s infinite; }                /* pálpebras: ficam por cima das pupilas */
  .chara .pupils { position: absolute; inset: 0; animation: gaze 13s ease-in-out infinite; }
  .chara .pupil { width: 10.5%; height: auto; }
  .chara .pupil.l { left: 28.2%; top: 47.8%; }
  .chara .pupil.r { left: 69.7%; top: 32.8%; }
  .chara .mouth { left: 52.5%; top: 80%; width: 20.9%; transition: opacity .18s; }
  .chara .mouth.smile { left: 50%; top: 66%; width: 24%; opacity: 0; }
  .chara .mouth.sad { left: 51.3%; top: 76.2%; width: 21.5%; opacity: 0; }
  .chara .hand { top: 82.6%; width: 26%; }
  .chara .hand.l { left: 13.3%; }
  .chara .hand.r { left: 79%; transform: scaleX(-1); }
  .chara.happy .face { animation: lift 3.6s ease-in-out both; }
  .chara.happy .mouth.closed { opacity: 0; }
  .chara.happy .mouth.smile { opacity: 1; }
  .chara.happy .pupils { animation: none; }
  .chara.happy .eyes-happy { opacity: 1; }
  /* triste: cabeça pendendo e soluçando, olhos e boca tristes, pupilas olhando para baixo, lágrimas saindo */
  .chara.sad .face { animation: droop 4.6s ease-in-out both; }
  .chara.sad .mouth.closed { opacity: 0; }
  .chara.sad .mouth.sad { opacity: 1; }
  .chara.sad .eyes-sad { opacity: 1; }
  .chara.sad .pupils { animation: none; transform: translate(-5%, 8%); transition: transform .4s; }
  .chara.sad .eyes-lids { animation: none; }
  .chara .tears { position: absolute; inset: 0; pointer-events: none; }
  .chara .tear { position: absolute; width: 10%; height: auto; opacity: 0; }   /* movida por JS (Web Animations): a ponta aponta para trás do movimento */
  .chara.happy .eyes-lids { animation: none; }
  .chara.wink .eyes-lids { animation: wink .95s ease-in-out both; }   /* remate: duas piscadinhas ao voltar ao normal */
  @keyframes wink { 0%, 100% { opacity: 0; } 12%, 24% { opacity: 1; } 38%, 52% { opacity: 0; } 64%, 78% { opacity: 1; } 90% { opacity: 0; } }
  @keyframes droop {   /* cabeça cai para a frente, solta uns soluços e se recompõe devagar */
    0% { transform: translateY(1px) rotate(0deg); }
    12% { transform: translate(2px, 10%) rotate(5.5deg); }
    18% { transform: translate(2px, 8%) rotate(5deg); }
    24% { transform: translate(2px, 10%) rotate(5.5deg); }
    30% { transform: translate(2px, 8%) rotate(5deg); }
    36% { transform: translate(2px, 10%) rotate(5.5deg); }
    44% { transform: translate(2px, 9%) rotate(5deg); }
    50% { transform: translate(2px, 10.5%) rotate(5.5deg); }
    57% { transform: translate(2px, 8.5%) rotate(5deg); }
    64% { transform: translate(2px, 10%) rotate(5.5deg); }
    78% { transform: translate(1px, 8%) rotate(4deg); }
    100% { transform: translateY(1px) rotate(0deg); }
  }
  @keyframes lift {   /* dança de alegria: pulinhos rápidos, balanço de um lado para o outro e leve amassadinho ao descer; depois se acalma */
    0% { transform: translateY(1px) rotate(0deg); }
    5% { transform: translate(-2px, -14%) rotate(-4deg) scale(1, 1.02); }
    10% { transform: translate(2px, -5%) rotate(3deg) scale(1.02, .97); }
    15% { transform: translate(-2px, -14%) rotate(-4deg) scale(1, 1.02); }
    20% { transform: translate(2px, -5%) rotate(3deg) scale(1.02, .97); }
    25% { transform: translate(-2px, -14%) rotate(-4deg) scale(1, 1.02); }
    30% { transform: translate(2px, -5%) rotate(3deg) scale(1.02, .97); }
    35% { transform: translate(-2px, -14%) rotate(-4deg) scale(1, 1.02); }
    40% { transform: translate(2px, -5%) rotate(3deg) scale(1.02, .97); }
    45% { transform: translate(-2px, -14%) rotate(-4deg) scale(1, 1.02); }
    50% { transform: translate(2px, -5%) rotate(3deg) scale(1.02, .97); }
    55% { transform: translate(-2px, -14%) rotate(-4deg) scale(1, 1.02); }
    60% { transform: translate(2px, -5%) rotate(3deg) scale(1.02, .97); }
    65% { transform: translate(-2px, -14%) rotate(-4deg) scale(1, 1.02); }
    70% { transform: translate(2px, -5%) rotate(3deg) scale(1.02, .97); }
    75% { transform: translate(-2px, -14%) rotate(-4deg) scale(1, 1.02); }
    80% { transform: translate(2px, -5%) rotate(3deg) scale(1.02, .97); }
    85% { transform: translate(-2px, -11%) rotate(-4deg) scale(1, 1.02); }
    92% { transform: translate(0, -7%) rotate(-1.5deg); }
    100% { transform: translateY(1px) rotate(0deg); }
  }
  @keyframes idle { 0%, 100% { transform: translateY(1px) rotate(0deg); } 50% { transform: translateY(-5px) rotate(-1.3deg); } }
  @keyframes gaze {   /* olha para os lados de vez em quando; as duas pupilas se movem juntas */
    0%, 18%, 38%, 46%, 68%, 76%, 94%, 100% { transform: translate(0, 0); }
    22%, 34% { transform: translate(-6%, 1%); }
    52%, 64% { transform: translate(6%, -4%); }
    80%, 90% { transform: translate(-3%, -5%); }
  }
  @keyframes blink { 0%, 92%, 100% { opacity: 0; } 94%, 97% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .chara .eyes-lids, .chara .face, .chara .pupils, .chara.happy .face, .chara.wink .eyes-lids, .chara.sad .face { animation: none; } }

  .rain { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 8; }
  .rain .bd { position: absolute; top: 0; height: auto; opacity: 0; animation: fall var(--dur) cubic-bezier(.45, .05, .9, .6) both; }
  @keyframes fall {   /* cai do topo, acelerando, e sai pela parte de baixo da tela */
    0% { transform: translate(0, -14vh) rotate(var(--r)); opacity: 0; }
    8% { opacity: 1; }
    100% { transform: translate(var(--sw), 112vh) rotate(calc(var(--r) * -1)); opacity: 1; }
  }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .backdrop.open { display: flex; }
  /* janelinha de confirmação no estilo do app (no lugar do aviso do navegador) */
  .dlg { z-index: 30; align-items: center; background: rgba(0, 0, 0, .65); }
  .dlgbox { --bw: 26px; width: min(92%, 380px); padding: 2px 6px 4px; }
  .dlgbox h2 { font: 400 26px/1.1 var(--display); margin: 0 0 8px; }
  .dlgbox p { margin: 0 0 14px; white-space: pre-line; color: var(--paper-ink); }
  .dlgbox .row2 { display: flex; gap: 8px; }
  .dlgbox .row2 .btn { margin: 0; flex: 1; }
  .sheet { --bw: 26px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; margin: 0 6px calc(6px + env(safe-area-inset-bottom)); padding: 0 4px; }
  .sheet h2 { font: 400 23px/1.1 var(--display); margin: 0 0 12px; }
  .sheet h2::first-letter { text-transform: uppercase; }
  .notebox { margin-bottom: 12px; }
  .notebox textarea { display: block; width: 100%; margin: 6px 0 8px; padding: 10px 12px; font: inherit; color: var(--paper-ink); background: #251d20; border: 1px solid var(--line); border-radius: 12px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--tint); color: var(--paper-ink); border: 0; border-radius: 16px; padding: 6px 12px; font-size: 14px; }
  .note-prev { white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--barh) + 165px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #5a2a3c; color: #fff; border: 2px solid var(--accent); padding: 10px 18px; border-radius: 12px; font-size: 15px; font-weight: 600; text-align: center; max-width: 90%; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; box-shadow: 0 4px 18px rgba(0, 0, 0, .55); }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <section id="tab-cal">
    <div id="banner"></div>
    <div id="summary" class="card accent"></div>
    <div class="nav">
      <button id="prev" aria-label="Mês anterior">‹</button>
      <div class="title" id="monthTitle"></div>
      <button id="next" aria-label="Próximo mês">›</button>
    </div>
    <button class="today-btn" id="goToday">Ir para hoje</button>
    <div class="grid" id="dows"></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>Início / fim</span>
      <span><i style="background:var(--mid)"></i>Menstruada</span>
      <span><i style="background:repeating-linear-gradient(135deg,#3a2a31 0 3px,#5a4650 3px 6px)"></i>Previsão</span>
      <span><i style="border:2px solid #fff;box-shadow:0 0 6px rgba(255,190,210,.9)"></i>Hoje</span>
      <span><i style="background:var(--accent);border-radius:50%;width:7px;height:7px;margin:0 6px 0 2px"></i>Anotação</span>
    </div>
  </section>

  <section id="tab-hist" hidden>
    <h1>Histórico</h1>
    <div id="hist"></div>
  </section>

  <section id="tab-bkp" hidden>
    <h1>Backup</h1>
    <div id="bkp"></div>
  </section>
</div>

<nav class="tabbar" role="tablist">
  <button role="tab" data-tab="cal" aria-selected="true" aria-label="Calendário"><img src="assets/tab-calendario.png" alt=""><em>Calendário</em></button>
  <button role="tab" data-tab="hist" aria-selected="false" aria-label="Histórico"><img src="assets/tab-historico.png" alt=""><em>Histórico</em></button>
  <button role="tab" data-tab="bkp" aria-selected="false" aria-label="Backup"><img src="assets/tab-backup.png" alt=""><em>Backup</em></button>
</nav>

<div class="chara-wrap" aria-hidden="true">
  <div class="chara">
    <div class="face">
      <img class="head" src="assets/head.png" alt="">
      <div class="eyes">
        <img class="eyes-base" src="assets/eyes-open.png" alt="">
        <img class="eyes-sad" src="assets/eyes-sad.png" alt="">
        <div class="pupils"><img class="pupil l" src="assets/pupil.png" alt=""><img class="pupil r" src="assets/pupil.png" alt=""></div>
        <img class="eyes-lids" src="assets/eyes-closed.png" alt="">
        <img class="eyes-happy" src="assets/eyes-happy.png" alt="">
      </div>
      <img class="mouth closed" src="assets/mouth.png" alt="">
      <img class="mouth smile" src="assets/mouth-smile.png" alt="">
      <img class="mouth sad" src="assets/mouth-sad.png" alt="">
    </div>
    <img class="hand l" src="assets/hand.png" alt="">
    <img class="hand r" src="assets/hand.png" alt="">
  </div>
</div>

<div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden>

<script>
'use strict';
const KEY = 'ciclo.v1', BKEY = 'ciclo.lastBackup';
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MON = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
const $ = id => document.getElementById(id);

/* ---------- datas (sempre texto AAAA-MM-DD, sem fuso) ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const todayISO = () => { const t = new Date(); return iso(t.getFullYear(), t.getMonth(), t.getDate()); };
const toUTC = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const diff = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 864e5);
const addDays = (s, n) => { const t = new Date(toUTC(s) + n * 864e5); return iso(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()); };
const validISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && addDays(s, 0) === s;
const fmt = (s, withYear) => { const [y, m, d] = s.split('-').map(Number); return `${d} ${MON[m - 1]}` + (withYear ? ` ${y}` : ''); };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CHIPS = ['Cólica', 'Fluxo intenso', 'Fluxo leve', 'Dor de cabeça', 'Cansaço', 'Inchaço'];

/* ---------- dados ---------- */
function cleanPeriods(arr) {
  return arr
    .filter(p => p && validISO(p.start))
    .map(p => ({ start: p.start, end: validISO(p.end) ? p.end : null }))
    .sort((a, b) => (a.start < b.start ? -1 : 1));
}
// anotações: { 'AAAA-MM-DD': 'texto' }
function cleanNotes(o) {
  const r = {};
  if (o && typeof o === 'object') for (const [k, v] of Object.entries(o)) if (validISO(k) && typeof v === 'string' && v.trim()) r[k] = v.slice(0, 500);
  return r;
}
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && Array.isArray(raw.periods)) return { version: 2, periods: cleanPeriods(raw.periods), notes: cleanNotes(raw.notes) };
  } catch (e) {}
  return { version: 2, periods: [], notes: {} };
}
let state = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('Não foi possível salvar neste aparelho'); }
}
// devolve mensagem de erro ou null
function check(list) {
  const l = [...list].sort((a, b) => (a.start < b.start ? -1 : 1));
  for (let i = 0; i < l.length; i++) {
    const p = l[i];
    if (p.end && p.end < p.start) return 'O fim não pode ser antes do início.';
    if (!p.end && i < l.length - 1) return 'Só o último período pode estar em andamento.';
    if (i > 0 && p.start <= l[i - 1].end) return 'Esse período se sobrepõe a outro registro.';
  }
  return null;
}
function mutate(fn, okMsg) {
  const copy = JSON.parse(JSON.stringify(state.periods));
  fn(copy);
  const err = check(copy);
  if (err) { toast(err); return false; }
  state.periods = copy.sort((a, b) => (a.start < b.start ? -1 : 1));
  save(); closeSheet(); renderAll();
  if (okMsg) toast(okMsg);
  return true;
}
// período em andamento aparece até hoje (no máximo 14 dias)
function shownEnd(p) {
  if (p.end) return p.end;
  const t = todayISO(), cap = addDays(p.start, 13);
  const e = t < cap ? t : cap;
  return e < p.start ? p.start : e;
}

/* ---------- interface ---------- */
let view = (() => { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; })();
let tab = 'cal';

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600);
}

// Previsão: início do último período + média dos últimos ciclos (ignora intervalos fora de 15–60 dias,
// que normalmente são meses sem registro). Não prevê durante uma menstruação em andamento.
function predict() {
  const ps = state.periods;
  if (!ps.length || ps.some(p => !p.end)) return null;
  const gaps = ps.slice(1).map((p, i) => diff(ps[i].start, p.start)).filter(g => g >= 15 && g <= 60).slice(-6);
  if (!gaps.length) return null;
  const avg = a => Math.round(a.reduce((x, y) => x + y, 0) / a.length);
  const durs = ps.map(p => diff(p.start, p.end) + 1).slice(-6);
  return { start: addDays(ps[ps.length - 1].start, avg(gaps)), days: avg(durs), cycle: avg(gaps), n: gaps.length, min: Math.min(...gaps), max: Math.max(...gaps) };
}

function renderSummary() {
  const el = $('summary'), ps = state.periods, t = todayISO();
  const open = ps.find(p => !p.end);
  if (open) {
    const n = diff(open.start, t) + 1;
    el.innerHTML = `<strong>Menstruação em andamento</strong><div class="muted">Dia ${n} · começou em ${fmt(open.start)}. Toque no último dia para marcar o fim.</div>`;
  } else if (ps.length) {
    const last = ps[ps.length - 1], n = diff(last.start, t);
    const pr = predict();
    let next = '<div class="muted" style="margin-top:8px">Registre mais um ciclo para ver a previsão da próxima.</div>';
    if (pr) {
      const k = diff(t, pr.start);
      const when = k > 0 ? `em ${plural(k, 'dia', 'dias')}` : k === 0 ? 'hoje' : `atrasada ${plural(-k, 'dia', 'dias')}`;
      const base = `Ciclo médio de ${pr.cycle} dias, de ${plural(pr.n, 'ciclo', 'ciclos')}` + (pr.min !== pr.max ? ` (varia de ${pr.min} a ${pr.max})` : '') + '. É só uma estimativa.';
      next = k < -14
        ? '<div class="muted" style="margin-top:8px">Já passou muito da data prevista. Se a menstruação veio, toque no dia em que começou para registrar.</div>'
        : `<div style="margin-top:8px"><strong>Próxima prevista: ${fmt(pr.start)}</strong> · ${when}</div><div class="muted">${base}</div>`;
    }
    el.innerHTML = `<strong>Último início: ${fmt(last.start, true)}</strong><div class="muted">${n <= 0 ? 'hoje' : 'há ' + plural(n, 'dia', 'dias')}</div>${next}`;
  } else {
    el.innerHTML = `<strong>Bem-vinda!</strong><div class="muted">Toque num dia do calendário para marcar o início da menstruação.</div>`;
  }
}

function renderBanner() {
  const el = $('banner');
  el.innerHTML = '';
  if (!state.periods.length) return;
  let last = null; try { last = localStorage.getItem(BKEY); } catch (e) {}
  const stale = !last || diff(last, todayISO()) > 30;
  if (!stale) return;
  el.innerHTML = `<div class="banner"><span>${last ? 'Seu último backup tem mais de 30 dias.' : 'Você ainda não fez backup dos seus dados.'}</span><button id="goBkp">Fazer backup</button></div>`;
  $('goBkp').onclick = () => setTab('bkp');
}

function renderCalendar() {
  const { y, m } = view, t = todayISO();
  $('monthTitle').textContent = `${MONTHS[m]} ${y}`;
  const marks = new Map();
  state.periods.forEach(p => {
    const e = shownEnd(p);
    for (let d = p.start; d <= e; d = addDays(d, 1)) {
      marks.set(d, d === p.start || d === p.end ? 'edge' : 'mid');
    }
  });
  const pr = predict();
  if (pr) for (let i = 0, d = pr.start; i < pr.days; i++, d = addDays(d, 1)) if (d >= t && !marks.has(d)) marks.set(d, 'pred');
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  let html = '';
  for (let i = 0; i < first; i++) html += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const s = iso(y, m, d);
    const cls = ['day', 'sq' + ((d * 5 + m) % 3 + 1), marks.get(s) || '', s === t ? 'today' : '', s > t ? 'future' : ''].join(' ');
    html += `<button class="${cls}" data-d="${s}"><span>${d}</span>${state.notes[s] ? '<i class="dot"></i>' : ''}</button>`;
  }
  $('grid').innerHTML = html;
}

function notesCard() {
  const ks = Object.keys(state.notes).sort().reverse();
  if (!ks.length) return '';
  const items = ks.slice(0, 30).map(k => `<li><button data-n="${k}"><div class="row1">${fmt(k, true)}</div><div class="muted note-prev">${esc(state.notes[k])}</div></button></li>`).join('');
  return `<h1 style="margin-top:20px">Anotações</h1><ul class="list">${items}</ul>` +
    (ks.length > 30 ? `<p class="muted">Mostrando as 30 mais recentes, de ${ks.length}.</p>` : '');
}

function renderHistory() {
  const ps = state.periods, el = $('hist');
  if (!ps.length) { el.innerHTML = '<div class="card muted">Nenhum registro ainda. Marque o início da menstruação no calendário.</div>' + notesCard(); return; }
  const gaps = ps.slice(1).map((p, i) => diff(ps[i].start, p.start));
  const durs = ps.filter(p => p.end).map(p => diff(p.start, p.end) + 1);
  const avg = a => Math.round(a.reduce((x, y) => x + y, 0) / a.length);
  let stats = '';
  if (gaps.length) {
    stats += `<div class="card"><div class="muted">Ciclo médio</div><div class="stat">${avg(gaps)} dias</div><div class="muted">variando de ${Math.min(...gaps)} a ${Math.max(...gaps)} dias · ${plural(gaps.length, 'ciclo', 'ciclos')}</div></div>`;
  }
  if (durs.length) {
    stats += `<div class="card"><div class="muted">Duração média da menstruação</div><div class="stat">${avg(durs)} ${avg(durs) === 1 ? 'dia' : 'dias'}</div></div>`;
  }
  const items = ps.map((p, i) => {
    const yr = p.start.slice(0, 4);
    const range = p.end ? `${fmt(p.start)} – ${fmt(p.end, true)}` : `${fmt(p.start, true)} – em andamento`;
    const dur = p.end ? plural(diff(p.start, p.end) + 1, 'dia', 'dias') : '';
    const gap = i > 0 ? `${plural(gaps[i - 1], 'dia', 'dias')} desde o início anterior` : 'primeiro registro';
    return `<li><button data-d="${p.start}"><div class="row1">${range}</div><div class="muted">${[dur, gap].filter(Boolean).join(' · ')}</div></button></li>`;
  }).reverse().join('');
  el.innerHTML = stats + `<ul class="list">${items}</ul>` + notesCard();
}

function renderBackup() {
  let last = null; try { last = localStorage.getItem(BKEY); } catch (e) {}
  const n = state.periods.length, nn = Object.keys(state.notes).length;
  $('bkp').innerHTML = `
    <div class="card">
      <div><strong>${plural(n, 'registro', 'registros')}</strong> e <strong>${plural(nn, 'anotação', 'anotações')}</strong> neste aparelho</div>
      <div class="muted">${last ? 'Último backup: ' + fmt(last, true) : 'Nenhum backup feito ainda.'}</div>
    </div>
    <button class="btn primary" id="exp">Enviar backup (e-mail, Drive…)</button>
    <button class="btn" id="dl">Baixar arquivo</button>
    <button class="btn" id="imp">Restaurar de um arquivo</button>
    <p class="muted">"Enviar backup" abre o menu do celular para você escolher e-mail, Google Drive, WhatsApp… O arquivo vai como .txt, e dá para restaurá-lo normalmente aqui.
    Guarde em um lugar seguro. Seus dados ficam só neste aparelho; nada é enviado para servidor algum.</p>`;
  $('exp').onclick = shareBackup;
  $('dl').onclick = downloadBackup;
  $('imp').onclick = () => $('fileIn').click();
}

function renderAll() {
  renderSummary(); renderBanner(); renderCalendar();
  if (tab === 'hist') renderHistory();
  if (tab === 'bkp') renderBackup();
}

function setTab(name) {
  tab = name;
  ['cal', 'hist', 'bkp'].forEach(n => { $('tab-' + n).hidden = n !== name; });
  document.querySelectorAll('.tabbar button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  if (name === 'hist') renderHistory();
  if (name === 'bkp') renderBackup();
  window.scrollTo(0, 0);
}

/* ---------- ações sobre um dia ---------- */
/* pergunta de confirmação no estilo do app; devolve uma Promise com true/false */
function askConfirm(msg, { title = 'Tem certeza?', ok = 'OK', cancel = 'Cancelar', danger = false } = {}) {
  return new Promise(resolve => {
    const bd = document.createElement('div'); bd.className = 'backdrop dlg open'; bd.setAttribute('role', 'alertdialog'); bd.setAttribute('aria-modal', 'true');
    bd.innerHTML = `<div class="dlgbox"><h2></h2><p></p><div class="row2"><button class="btn" data-r="0"></button><button class="btn ${danger ? '' : 'primary'}" data-r="1"></button></div></div>`;
    bd.querySelector('h2').textContent = title; bd.querySelector('p').textContent = msg;
    const [bc, bo] = bd.querySelectorAll('button'); bc.textContent = cancel; bo.textContent = ok;
    if (danger) { bo.style.cssText = 'background:#b3262e;color:#fff;border-color:transparent'; }
    const done = r => { document.removeEventListener('keydown', key); bd.remove(); resolve(r); };
    const key = e => { if (e.key === 'Escape') done(false); };
    bd.onclick = e => { if (e.target === bd) done(false); else if (e.target.dataset.r) done(e.target.dataset.r === '1'); };
    document.addEventListener('keydown', key); document.body.appendChild(bd); bc.focus();
  });
}

function closeSheet() { $('backdrop').classList.remove('open'); }
function openSheet(d) {
  const ps = state.periods, t = todayISO();
  const open = ps.find(p => !p.end);
  const cont = ps.find(p => d >= p.start && d <= shownEnd(p));
  const acts = []; let note = '';
  if (cont) {
    const i = ps.indexOf(cont);
    if (d !== cont.start) acts.push(['Mudar o início para este dia', () => mutate(l => { l[i].start = d; }, 'Início alterado')]);
    if (d >= cont.start && d !== cont.end) acts.push(['Marcar o fim neste dia', () => { const emAndamento = !cont.end; if (mutate(l => { l[i].end = d; }, 'Fim marcado') && emAndamento) sadMoment(); }]);
    acts.push(['Remover este registro', async () => { if (await askConfirm('Esse período vai sair do histórico.', { title: 'Remover registro?', ok: 'Remover', danger: true })) mutate(l => { l.splice(i, 1); }, 'Registro removido'); }, 'danger']);
  } else if (d > t) {
    note = 'Só é possível registrar dias até hoje.';
  } else if (open && d > open.start) {
    const i = ps.indexOf(open);
    acts.push(['Marcar o fim neste dia', () => { if (mutate(l => { l[i].end = d; }, 'Fim marcado')) sadMoment(); }]);
  } else {
    // antes de um registro já existente (preencher o passado): vira período de 1 dia, e o fim é ajustado depois
    const backfill = !!open || ps.some(p => p.start > d);
    acts.push(['Marcar o início da menstruação aqui', () => { if (mutate(l => { l.push({ start: d, end: backfill ? d : null }); }, 'Início marcado') && !backfill) celebrate(); }]);
    const prev = [...ps].reverse().find(p => p.end && p.end < d);
    if (prev && diff(prev.end, d) <= 14) {
      const i = ps.indexOf(prev);
      acts.push([`Mudar o fim do período de ${fmt(prev.start)} para este dia`, () => mutate(l => { l[i].end = d; }, 'Fim alterado')]);
    }
    if (backfill) note = 'Para um período passado, marque o início e depois toque no último dia dele para ajustar o fim.';
  }
  const [y, m, day] = d.split('-').map(Number);
  const wd = DOW[new Date(y, m - 1, day).getDay()];
  $('sheet').innerHTML = `<h2>${wd}, ${day} de ${MONTHS[m - 1]} de ${y}</h2>` +
    `<div class="notebox"><label class="muted" for="noteTxt">Anotação do dia (salva sozinha)</label>` +
    `<textarea id="noteTxt" rows="3" maxlength="500" placeholder="Como foi o dia? Cólica, humor, fluxo…">${esc(state.notes[d] || '')}</textarea>` +
    `<div class="chips">${CHIPS.map(c => `<button type="button" class="chip" data-chip="${c}">${c}</button>`).join('')}</div></div>` +
    (note ? `<p class="muted">${note}</p>` : '') +
    acts.map((a, k) => `<button class="btn ${a[2] || ''}" data-k="${k}">${a[0]}</button>`).join('') +
    `<button class="btn" data-k="x">Fechar</button>`;
  const ta = $('noteTxt');
  ta.oninput = () => setNote(d, ta.value);
  $('sheet').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.chip) {
      ta.value = (ta.value + (ta.value && !/\s$/.test(ta.value) ? ' ' : '') + b.dataset.chip + '. ').slice(0, 500);
      setNote(d, ta.value); return;
    }
    if (b.dataset.k === 'x') closeSheet(); else acts[+b.dataset.k][1]();
  };
  $('backdrop').classList.add('open');
}

/* início da menstruação marcado: o monstrinho levanta a cabeça e sorri, e cai uma chuva de gotas */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function celebrate() {
  const c = document.querySelector('.chara');
  c.classList.remove('happy', 'wink', 'sad'); c.querySelector('.tears')?.remove(); void c.offsetWidth; c.classList.add('happy');
  clearTimeout(celebrate.t); clearTimeout(celebrate.w);
  celebrate.t = setTimeout(() => {
    c.classList.remove('happy');
    if (!reduceMotion) { c.classList.add('wink'); celebrate.w = setTimeout(() => c.classList.remove('wink'), 1000); }
  }, reduceMotion ? 2500 : 3700);
  if (reduceMotion) return;
  const rain = document.createElement('div'); rain.className = 'rain'; rain.setAttribute('aria-hidden', 'true');
  for (let i = 0; i < 32; i++) {
    const img = new Image(); img.src = 'assets/blood-drop.png'; img.alt = ''; img.className = 'bd';
    img.style.cssText = `left:${3 + Math.random() * 92}%;width:${10 + Math.random() * 20}px;--dur:${1.7 + Math.random() * 1.4}s;animation-delay:${(Math.random() * 1.3 - 0.2).toFixed(2)}s;--sw:${Math.round(Math.random() * 40 - 20)}px;--r:${Math.round(Math.random() * 30 - 15)}deg`;
    rain.appendChild(img);
  }
  document.body.appendChild(rain); setTimeout(() => rain.remove(), 4700);
}

/* fim da menstruação marcado: o monstrinho fica cabisbaixo e chorando */
function sadMoment() {
  const c = document.querySelector('.chara');
  c.classList.remove('happy', 'wink', 'sad'); c.querySelector('.tears')?.remove(); void c.offsetWidth; c.classList.add('sad');
  clearTimeout(celebrate.t); clearTimeout(celebrate.w); clearTimeout(sadMoment.t);
  sadMoment.t = setTimeout(() => c.classList.remove('sad'), reduceMotion ? 2500 : 4800);
  if (reduceMotion) return;
  const box = document.createElement('div'); box.className = 'tears'; box.setAttribute('aria-hidden', 'true');
  for (let i = 0; i < 10; i++) {   // alterna olho esquerdo/direito; cada lágrima sobe um pouco, abre para o lado e cai
    const left = i % 2 === 0, sgn = left ? -1 : 1, t = new Image();
    t.src = 'assets/tear.png'; t.alt = ''; t.className = 'tear';
    t.style.left = (left ? 39.5 : 79.1) + '%'; t.style.top = (left ? 79.7 : 67.8) + '%';
    const dx = sgn * (40 + Math.random() * 80), dy = 50 + Math.random() * 90, up = 26 + Math.random() * 16, N = 16, frames = [];
    for (let k = 0; k <= N; k++) {
      const u = k / N, x = dx * u, y = -up * u + (dy + up) * u * u;                 // trajetória em arco
      const vx = dx, vy = -up + 2 * (dy + up) * u;                                  // velocidade naquele ponto
      const ang = Math.atan2(-vx, vy) * 180 / Math.PI;                              // ponta da gota para trás do movimento
      frames.push({ offset: u, opacity: u < .08 ? u / .08 : u > .8 ? (1 - u) / .2 : 1,
        transform: `translate(-50%, -50%) translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${ang.toFixed(1)}deg) scale(${(.6 + .4 * Math.min(1, u * 4)).toFixed(2)})` });
    }
    t.animate(frames, { duration: 1100 + Math.random() * 700, delay: 250 + i * 330 + Math.random() * 200, fill: 'both', easing: 'linear' });
    box.appendChild(t);
  }
  c.appendChild(box); setTimeout(() => box.remove(), 5800);
}

function setNote(d, txt) {
  if (txt.trim()) state.notes[d] = txt.slice(0, 500); else delete state.notes[d];
  save(); renderCalendar();
  if (tab === 'hist') renderHistory();
}

/* ---------- backup ---------- */
function markBackup() { try { localStorage.setItem(BKEY, todayISO()); } catch (e) {} renderAll(); }

function backupJSON() {
  return JSON.stringify({ app: 'monstro', version: 2, exportedAt: new Date().toISOString(), periods: state.periods, notes: state.notes }, null, 2);
}

// O Chrome do Android só compartilha arquivos de alguns tipos (.txt sim, .json não),
// então o arquivo compartilhado é .txt com o mesmo conteúdo do .json.
async function shareBackup() {
  if (!navigator.share) { toast('Este navegador não consegue compartilhar. Use "Baixar arquivo".'); return; }
  const json = backupJSON(), title = 'Backup do Monstro';
  try {
    const file = new File([json], `monstro-backup-${todayISO()}.txt`, { type: 'text/plain' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title });
    else await navigator.share({ title, text: json });   // sem anexo: o backup vai como texto
    markBackup(); toast('Backup compartilhado');
  } catch (e) {
    if (e.name !== 'AbortError') toast('Não deu para compartilhar (' + e.name + '). Use "Baixar arquivo".');
  }
}

function downloadBackup() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([backupJSON()], { type: 'application/json' }));
  a.download = `monstro-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  markBackup(); toast('Arquivo baixado');
}

function importBackup(file) {
  const r = new FileReader();
  r.onload = async () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || !Array.isArray(data.periods)) throw new Error();
      const list = cleanPeriods(data.periods);
      if (list.length !== data.periods.length) throw new Error();
      const err = check(list);
      if (err) throw new Error();
      // backups antigos não têm anotações: nesse caso as anotações atuais são mantidas
      const notes = data.notes && typeof data.notes === 'object' ? cleanNotes(data.notes) : null;
      const last = list[list.length - 1];
      const faixa = last ? `, de ${fmt(list[0].start, true)} até ${fmt(last.end || last.start, true)}` : '';
      const nota = notes ? ` e ${plural(Object.keys(notes).length, 'anotação', 'anotações')}` : ' (sem anotações: as suas atuais serão mantidas)';
      if (!(await askConfirm(`O arquivo tem ${plural(list.length, 'registro', 'registros')}${nota}${faixa}.\n\nSubstituir ${plural(state.periods.length, 'registro atual', 'registros atuais')} por esses?`, { title: 'Restaurar backup?', ok: 'Restaurar' }))) return;
      state.periods = list; if (notes) state.notes = notes; save();
      if (last) { const [y, m] = last.start.split('-').map(Number); view = { y, m: m - 1 }; }
      renderAll(); setTab('cal'); toast(`Backup restaurado: ${plural(list.length, 'registro', 'registros')}`);
    } catch (e) { toast('Arquivo inválido: nada foi alterado'); }
  };
  r.readAsText(file);
}

/* ---------- eventos ---------- */
$('dows').innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join('');
$('prev').onclick = () => { view = view.m ? { y: view.y, m: view.m - 1 } : { y: view.y - 1, m: 11 }; renderCalendar(); };
$('next').onclick = () => { view = view.m < 11 ? { y: view.y, m: view.m + 1 } : { y: view.y + 1, m: 0 }; renderCalendar(); };
$('goToday').onclick = () => { const t = new Date(); view = { y: t.getFullYear(), m: t.getMonth() }; renderCalendar(); };
$('grid').onclick = e => { const b = e.target.closest('.day'); if (b) openSheet(b.dataset.d); };
$('hist').onclick = e => {
  const n = e.target.closest('button[data-n]');
  if (n) {
    const [y, m] = n.dataset.n.split('-').map(Number);
    view = { y, m: m - 1 }; setTab('cal'); renderCalendar(); openSheet(n.dataset.n); return;
  }
  const b = e.target.closest('button[data-d]'); if (!b) return;
  const [y, m] = b.dataset.d.split('-').map(Number);
  view = { y, m: m - 1 }; setTab('cal'); renderCalendar();
};
$('backdrop').onclick = e => { if (e.target === $('backdrop')) closeSheet(); };
document.querySelector('.tabbar').onclick = e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); };
$('fileIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); };

// atualiza ao voltar para o app (virou o dia, etc.)
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderAll(); });

renderAll();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
